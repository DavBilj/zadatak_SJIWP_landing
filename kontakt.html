<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natjecanja</title>
    <link href="dist/output.css" rel="stylesheet">
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200">

    <header class="flex items-center justify-between p-4 bg-white shadow-sm dark:bg-slate-800">
        <img src="logo.png" alt="logo" class="h-6 w-10 dark:hidden">
        <img src="logoDARK.png" alt="logoDARK" class="h-6 w-10 hidden dark:block">
        <a href="#" class="focus-ring rounded-lg text-xl font-bold text-brand">Natjecanja</a>
        <nav class="flex gap-4">
            <a href="index.html"
                class="focus-ring rounded-lg px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-medium hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors dark:hover:text-brand">Katalog</a>
            <a href="kontakt.html"
                class="focus-ring rounded-lg px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-medium hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors dark:hover:text-brand">Kontakt</a>
        </nav>
    </header>

    <main class="grid lg:grid-cols-4 gap-6 max-w-6xl mx-auto p-6">
        <section id="kontakt" class="lg:col-span-3">
            <h1 class="text-2xl md:text-4xl lg:text-5xl font-bold pb-10 pt-10">Kontakt</h1>

            <article
                class="card @container group flex flex-col p-6 dark:bg-slate-800 rounded-xl shadow-sm transition-all hover:shadow-md">
                <div class="flex items-center gap-3 mb-2">
                    <h2
                        class="text-xl font-bold text-slate-900 dark:text-white group-hover:text-brand transition-colors">
                        Kontaktirajte nas
                    </h2>
                </div>

                <p class="flex-1 mt-2 text-slate-600 leading-relaxed dark:text-slate-400 text-sm">
                    Imate pitanja u vezi s natjecanjima ili prijavama? Javite nam se direktno putem e-pošte!
                </p>

                <div
                    class="flex flex-col gap-4 mt-6 @sm:flex-row @sm:items-center @sm:justify-between pt-4 border-t border-slate-100 dark:border-slate-700/50">
                    <p class="text-sm font-medium text-slate-700 dark:text-slate-300 truncate">
                        kontaktnatjecanja@example.com
                    </p>

                    <a href="#"
                        class="btn-primary text-center text-sm px-4 py-2 rounded-lg font-medium transition-colors">
                        Pošalji upit
                    </a>
                </div>
            </article>

        </section>

    </main>

    <footer id="kontakt" class="p-6 text-brand text-center text-sm dark:text-brand">
        natjecanja@example.com &copy; 2026 natjecanja
    </footer>
</body>

</html>
